<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><rect width="1500" height="1050" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:16px}.title{font-weight:bold;font-size:19px}</style><defs><marker id="triangle" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,8 L0,16 Z" fill="white" stroke="#22364a" stroke-width="2"/></marker><marker id="diamond" markerWidth="22" markerHeight="14" refX="1" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,7 L10,0 L20,7 L10,14 Z" fill="white" stroke="#22364a" stroke-width="2"/></marker></defs><text x="40" y="35" class="title">INF1103 Week 9 — Inventory class diagram</text><rect x="470" y="70" width="530" height="245" fill="#f4f8fc" stroke="#22364a" stroke-width="2"/><text x="735.0" y="98" text-anchor="middle" class="title">Product &lt;&lt;abstract&gt;&gt;</text><path d="M470,115 H1000" stroke="#22364a"/><text x="482" y="140">- __product_id: str; - __name: str</text><text x="482" y="165">- __price: float; - __stock: int</text><text x="482" y="190">+ __init__(product_id, name, price, stock)</text><text x="482" y="215">+ product_id, name, price, stock: read-only properties</text><text x="482" y="240">+ update_stock(quantity: int): None</text><text x="482" y="265">+ display_information(): None</text><text x="482" y="290">+ get_fulfilment_info(): str &lt;&lt;abstract&gt;&gt;</text><rect x="30" y="85" width="400" height="220" fill="#f4f8fc" stroke="#22364a" stroke-width="2"/><text x="230.0" y="113" text-anchor="middle" class="title">Inventory</text><path d="M30,130 H430" stroke="#22364a"/><text x="42" y="155">- __products: list[Product]</text><text x="42" y="180">+ __init__()</text><text x="42" y="205">+ add_product(product: Product): None</text><text x="42" y="230">+ search_product(id): Product | None</text><text x="42" y="255">+ get_products(): tuple[Product, ...]</text><text x="42" y="280">+ display_all(): None</text><rect x="1050" y="85" width="420" height="145" fill="#f4f8fc" stroke="#22364a" stroke-width="2"/><text x="1260.0" y="113" text-anchor="middle" class="title">CanBeShipped &lt;&lt;interface&gt;&gt;</text><path d="M1050,130 H1470" stroke="#22364a"/><text x="1062" y="155">&lt;&lt;abstract&gt;&gt;</text><text x="1062" y="180">+ calculate_shipping_cost(): float</text><text x="1062" y="205">  &lt;&lt;abstract&gt;&gt;</text><rect x="30" y="550" width="460" height="220" fill="#f4f8fc" stroke="#22364a" stroke-width="2"/><text x="260.0" y="578" text-anchor="middle" class="title">PhysicalProduct</text><path d="M30,595 H490" stroke="#22364a"/><text x="42" y="620">- __weight: float</text><text x="42" y="645">+ __init__(id, name, price, stock, weight)</text><text x="42" y="670">+ weight: float (read-only)</text><text x="42" y="695">+ display_information(): None</text><text x="42" y="720">+ get_fulfilment_info(): str</text><text x="42" y="745">+ calculate_shipping_cost(): float</text><rect x="520" y="550" width="460" height="195" fill="#f4f8fc" stroke="#22364a" stroke-width="2"/><text x="750.0" y="578" text-anchor="middle" class="title">DigitalProduct</text><path d="M520,595 H980" stroke="#22364a"/><text x="532" y="620">- __download_size: float</text><text x="532" y="645">+ __init__(id, name, price, stock, size)</text><text x="532" y="670">+ download_size: float (read-only)</text><text x="532" y="695">+ display_information(): None</text><text x="532" y="720">+ get_fulfilment_info(): str</text><rect x="1010" y="550" width="460" height="195" fill="#f4f8fc" stroke="#22364a" stroke-width="2"/><text x="1240.0" y="578" text-anchor="middle" class="title">SubscriptionProduct</text><path d="M1010,595 H1470" stroke="#22364a"/><text x="1022" y="620">- __duration_months: int</text><text x="1022" y="645">+ __init__(id, name, price, stock, months)</text><text x="1022" y="670">+ duration_months: int (read-only)</text><text x="1022" y="695">+ display_information(): None</text><text x="1022" y="720">+ get_fulfilment_info(): str</text><path d="M260,550 V440 H620 V315" fill="none" stroke="#22364a" stroke-width="2" stroke-dasharray="" marker-end="url(#triangle)"/><path d="M750,550 V315" fill="none" stroke="#22364a" stroke-width="2" stroke-dasharray="" marker-end="url(#triangle)"/><path d="M1240,550 V440 H880 V315" fill="none" stroke="#22364a" stroke-width="2" stroke-dasharray="" marker-end="url(#triangle)"/><path d="M380,550 V490 H1260 V230" fill="none" stroke="#22364a" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#triangle)"/><path d="M430,200 H470" stroke="#22364a" stroke-width="2" marker-start="url(#diamond)"/><text x="432" y="177">1</text><text x="433" y="228">0..*</text><text x="40" y="870">Solid line + hollow triangle: inheritance. Dashed line + hollow triangle: interface realisation.</text><text x="40" y="900">Hollow diamond: Inventory aggregates independently created Product objects. + public; - private.</text><text x="40" y="930">PhysicalProduct has one product superclass and implements one capability contract.</text><text x="40" y="960">Constructors in subclass boxes use shortened parameter labels; full signatures appear in uml.mmd and source.</text></svg>